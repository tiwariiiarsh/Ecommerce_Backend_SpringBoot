spring.application.name=Ecommerce

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# JWT Configuration
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME}

# ===============================
# Frontend / CORS
# ===============================
frontend.url=${FRONTEND_URL}

# ===============================
# Image Configuration
# ===============================
product.image=images/
image.base.url=${IMAGE_BASE_URL}

# ===============================
# Stripe Configuration
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}

# ===============================
# Logging (optional – dev only)
# ===============================
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.Ecommerce.Project=DEBUG

server.port=8080
spring.profiles.active=dev