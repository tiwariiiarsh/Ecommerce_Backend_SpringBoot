spring.application.name=Ecommerce

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# JWT Configuration
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME}

# ===============================
# Frontend / CORS
# ===============================
frontend.url=${FRONTEND_URL}

# ===============================
# Image Configuration
# ===============================
product.image=images/
image.base.url=${IMAGE_BASE_URL}
# local pe false rehga, Render pe env variable true override karega
app.secure-cookie=${APP_SECURE_COOKIE}
# ===============================
# Stripe Configuration
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}

# ===============================
# Server
# ===============================
server.port=10000