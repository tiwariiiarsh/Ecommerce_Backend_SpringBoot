spring.application.name=Ecommerce

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# JWT Configuration
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS}
spring.ecom.app.jwtCookieName=${JWT_COOKIE_NAME:jwtCookieName}

# ===============================
# Frontend / CORS
# ===============================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# Image Configuration
# ===============================
product.image=images/
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# Secure cookie (auto handle dev vs prod)
app.secure-cookie=${APP_SECURE_COOKIE:false}

# ===============================
# Stripe Configuration
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY}

# ===============================
# Server (VERY IMPORTANT)
# ===============================
server.port=${PORT:8080}